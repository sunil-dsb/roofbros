openapi: 3.0.0
info:
  title: Nearmap API
  description: Endpoints for the Nearmap integration module
  version: 1.0.0
tags:
  - name: Nearmap
    description: Nearmap-related endpoints

paths:
  /v1/nearmap/coverage:
    get:
      summary: Get coverage
      description: Get Nearmap coverage for a specific address
      tags:
        - Nearmap
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object

  /v1/nearmap/features/{surveyResourceId}:
    get:
      summary: Get features
      description: Get features from Nearmap using a surveyResourceId
      tags:
        - Nearmap
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: surveyResourceId
          required: true
          schema:
            type: string
        - in: query
          name: transactionToken
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object

  /v1/nearmap/staticmap/{surveyId}:
    get:
      summary: Get static map
      description: Fetches the Nearmap static map image for a given survey and uploads it to storage. Returns a relative URL.
      tags:
        - Nearmap
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
        - in: query
          name: transactionToken
          required: true
          schema:
            type: string
        - in: query
          name: bbox
          required: false
          schema:
            type: string
          description: Bounding box for the map image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object

  /v1/nearmap/roof-details:
    get:
      summary: Get roof details (consolidated)
      description: Fetches area_sq_mt, pitch, confidence, tilesize, totalTiles, area_square and Base64 roofImage in a single call.
      tags:
        - Nearmap
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
