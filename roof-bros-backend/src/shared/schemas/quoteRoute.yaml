openapi: 3.0.0
info:
  title: Quote API
  description: Endpoints for the Quote module
  version: 1.0.0
tags:
  - name: Quote
    description: Quote-related endpoints

paths:
  /v1/quotes/{jobId}:
    post:
      summary: Create a new quote
      description: Create a new quote for a specific job
      tags:
        - Quote
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - area_sq_mt
                - topCoatBuckets
                - primerType
                - primer
                - totalTiles
              properties:
                area_sq_mt:
                  type: number
                topCoatBuckets:
                  type: number
                primerType:
                  type: string
                primer:
                  type: number
                totalTiles:
                  type: number
                jobType:
                  type: string
                  enum: [new roof installation, roof restoration]
                tileType:
                  type: string
                tileprofile:
                  type: string
                tile color:
                  type: string
                tileTypeId:
                  type: string
                tileProfileId:
                  type: string
                tileColorId:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Quote Created Successfully
                  data:
                    type: object
        '404':
          description: Job Not Found

    get:
      summary: Get all quotes for a job
      description: Get all quotes for a specific job
      tags:
        - Quote
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Quotes Fetched Successfully
                  data:
                    type: array
                    items:
                      type: object
        '404':
          description: Job Not Found
